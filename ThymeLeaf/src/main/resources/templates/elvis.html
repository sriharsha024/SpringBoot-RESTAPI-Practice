<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org/">
<head>
    <meta charset="UTF-8">
    <title>Elvis</title>
</head>
<body>
<p th:text="${isAdmin} ? 'Welcome Admin': 'Welcome Welcome' "></p>
<p th:if="${isAdmin}"> You are Admin</p>
<p th:if="${gender}=='M'">Male</p>
<p th:unless="${gender}=='M'">Female</p>
<h1>Switch case</h1>
<div th:switch="${gender}">
    <p th:case="M"> Your are Male</p>
    <p th:case="F"> Your are Female</p>
    <p th:case="*">Enter gender</p>
</div>
</body>
</html>
